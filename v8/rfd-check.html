<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FleetPro — RFD Check</title>
<link rel="icon" type="image/png" href="/v8/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F3F4F6;--text:#111827;--muted:#6B7280;--border:#E5E7EB;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:12px;--primary:#E8191C;--sidebar-w:240px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* Auth Screen */
#auth-screen{position:fixed;inset:0;background:#1A1A2E;z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-box{background:#fff;border-radius:16px;padding:36px 32px;width:360px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.auth-logo img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.auth-logo-text .t1{font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.auth-logo-text .t2{font-size:1.1rem;font-weight:700;color:var(--text)}
.auth-title{font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:18px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.auth-field input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
.auth-field input:focus{border-color:#6366F1}
.auth-btn{width:100%;padding:11px;background:#E8191C;color:#fff;border:none;border-radius:8px;font-size:.85rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:8px;transition:opacity .15s}
.auth-btn:hover{opacity:.9}
.auth-err{font-size:.75rem;color:#E8191C;margin-top:10px;min-height:18px;text-align:center}

/* Sidebar overlay */
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199}
#ov.show{display:block}

/* Sidebar */
#sb{position:fixed;top:0;left:0;height:100vh;width:var(--sidebar-w);z-index:200;transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column}
#sb.open{transform:translateX(0)}
.sb-header{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 12px;gap:8px;flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.sb-brand-text .t1{font-size:.65rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sb-brand-text .t2{font-size:.9rem;font-weight:700}
.pin-btn{font-size:.65rem;font-weight:600;padding:4px 8px;border-radius:6px;border:none;cursor:pointer;background:transparent;display:flex;align-items:center;gap:4px}
.sb-section{padding:4px 8px}
.sb-label{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px 2px;opacity:.5}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:.78rem;font-weight:500;text-decoration:none;transition:background .12s,color .12s;cursor:pointer}
.si{font-size:.9rem;width:20px;text-align:center;flex-shrink:0}
.sb-spacer{flex:1}
.sb-footer{padding:10px 16px 14px;flex-shrink:0}
.sb-ver{font-size:.62rem}

/* Top bar */
#top{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
body.pinned #top{margin-left:var(--sidebar-w)}
body.pinned #main{margin-left:var(--sidebar-w)}
#hbg{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;line-height:1}
#hbg:hover{background:var(--bg);color:var(--text)}
.top-bc{font-size:.78rem;color:var(--muted)}
.top-bc span{color:var(--text);font-weight:600}

/* Main */
#main{transition:margin-left .22s ease;min-height:100vh}

/* Hero + search */
#hero{background:linear-gradient(135deg,#1A1A2E 0%,#16213E 100%);color:#fff;padding:32px 24px 36px;text-align:center}
.hero-title{font-size:1.25rem;font-weight:700;margin-bottom:6px}
.hero-sub{font-size:.78rem;color:rgba(255,255,255,.5);margin-bottom:28px}
.search-row{display:flex;gap:0;max-width:520px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#reg-input{flex:1;padding:14px 18px;font-size:1rem;font-family:'Inter',sans-serif;border:none;outline:none;background:#fff;color:#111827;min-width:0}
#reg-input::placeholder{color:#9CA3AF}
#search-btn{padding:14px 22px;background:#E8191C;color:#fff;border:none;font-size:.85rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;white-space:nowrap;transition:opacity .15s}
#search-btn:hover{opacity:.9}
#search-btn:disabled{opacity:.5;cursor:default}
.sync-note{font-size:.65rem;color:rgba(255,255,255,.3);margin-top:10px}

/* Result area */
#result-area{max-width:680px;margin:28px auto;padding:0 16px 48px}

/* Multi-match list */
.match-list{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.match-list-header{padding:12px 16px;font-size:.72rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.match-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;text-decoration:none;color:var(--text)}
.match-item:last-child{border-bottom:none}
.match-item:hover{background:#F9FAFB}
.match-reg{font-weight:700;font-size:.85rem}
.match-hub{font-size:.72rem;color:var(--muted)}

/* Result card */
.result-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:1px solid var(--border);overflow:hidden}
.rc-status-bar{padding:16px 20px;display:flex;align-items:center;gap:14px}
.rc-status-bar.ok{background:#F0FDF4}
.rc-status-bar.fail{background:#FEF2F2}
.rc-verdict{font-size:1rem;font-weight:800;letter-spacing:-.01em}
.rc-verdict.ok{color:#15803D}
.rc-verdict.fail{color:#DC2626}
.rc-reg{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:auto}
.rc-hub{font-size:.72rem;color:var(--muted)}

.rc-section{padding:16px 20px;border-top:1px solid var(--border)}
.rc-section-title{font-size:.62rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.check-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid #F9FAFB}
.check-row:last-child{border-bottom:none}
.check-icon{font-size:1rem;flex-shrink:0;width:22px;text-align:center;margin-top:1px}
.check-label{font-size:.8rem;font-weight:600;color:var(--text);flex:1}
.check-detail{font-size:.7rem;color:var(--muted);margin-top:2px}
.check-badge{flex-shrink:0;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap}
.cb-ok{background:#D1FAE5;color:#065F46}
.cb-fail{background:#FEE2E2;color:#991B1B}
.cb-amber{background:#FEF3C7;color:#92400E}
.cb-muted{background:#F3F4F6;color:#6B7280}

.ctx-row{display:flex;gap:8px;padding:6px 0;font-size:.78rem;border-bottom:1px solid #F9FAFB}
.ctx-row:last-child{border-bottom:none}
.ctx-key{color:var(--muted);font-weight:500;min-width:120px;flex-shrink:0}
.ctx-val{color:var(--text);font-weight:500;word-break:break-word}

/* Empty / not-found state */
.result-empty{text-align:center;padding:40px 20px;color:var(--muted)}
.result-empty .emoji{font-size:2.5rem;margin-bottom:12px}
.result-empty p{font-size:.85rem}
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="logo.jpg" alt="Bounce"/>
      <div class="auth-logo-text"><div class="t1">Bounce Daily</div><div class="t2">FleetPro</div></div>
    </div>
    <div class="auth-title">Sign in to continue</div>
    <div class="auth-field"><label>Email</label><input id="a-email" type="email" placeholder="you@bounce.com" autocomplete="email"/></div>
    <div class="auth-field"><label>Password</label><input id="a-pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="auth-btn" onclick="doLogin()">Sign In</button>
    <div class="auth-err" id="a-err"></div>
  </div>
</div>

<div id="ov"></div>
<nav id="sb"></nav>

<div id="main">
  <header id="top">
    <button id="hbg" onclick="toggleSidebar()">☰</button>
    <div class="top-bc">FleetPro <span style="margin:0 5px;color:var(--border)">›</span> <span>RFD Check</span></div>
  </header>

  <div id="hero">
    <div class="hero-title">🚦 RFD Check</div>
    <div class="hero-sub">Enter a registration number to check IoT, MCU &amp; JC billing status</div>
    <div class="search-row">
      <input id="reg-input" type="text" placeholder="e.g. BLRBD00028" autocomplete="off"
        onkeydown="if(event.key==='Enter')doSearch()"/>
      <button id="search-btn" onclick="doSearch()">Check →</button>
    </div>
    <div class="sync-note" id="sync-note">Data syncs every 2 hours from Metabase</div>
  </div>

  <div id="result-area"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./sidebar.js"></script>
<script>
var SB_URL  = 'https://clkfvmmlgwcvntxnolsv.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsa2Z2bW1sZ3djdm50eG5vbHN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NDQ2NTgsImV4cCI6MjA5MDEyMDY1OH0.FA33GFQisWX_hDeGCWqL5yAZmPcuQRdxZX32I23lyoY';
var sb = supabase.createClient(SB_URL, ANON_KEY);
var K = ANON_KEY;
var hubMap = {};

// ── Auth ─────────────────────────────────────────────────────────────────
function bootPage(){
  sb.auth.getSession().then(function(r){
    if(r.data && r.data.session) activateSession(r.data.session);
  });
}

function doLogin(){
  var email=document.getElementById('a-email').value.trim();
  var pass=document.getElementById('a-pass').value;
  document.getElementById('a-err').textContent='';
  sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    if(r.error){document.getElementById('a-err').textContent=r.error.message;return;}
    activateSession(r.data.session);
  });
}

function activateSession(session){
  K=session.access_token;
  loadAndApplyPermissions(session).then(function(ok){
    if(!ok){window.location.href='index.html';return;}
    document.getElementById('auth-screen').style.display='none';
    loadHubMap();
    loadSyncNote();
    document.getElementById('reg-input').focus();
  });
}

function loadAndApplyPermissions(session){
  if(session.user&&session.user.app_metadata&&session.user.app_metadata.is_superadmin)
    return Promise.resolve(true);
  return fetch(SB_URL+'/rest/v1/user_groups?select=group_id&user_id=eq.'+session.user.id,
    {headers:{apikey:ANON_KEY,Authorization:'Bearer '+K}})
    .then(function(r){return r.json();}).then(function(groups){
      if(!groups||!groups.length) return false;
      var gids=groups.map(function(g){return g.group_id;}).join(',');
      return fetch(SB_URL+'/rest/v1/group_features?select=feature_key&group_id=in.('+gids+')',
        {headers:{apikey:ANON_KEY,Authorization:'Bearer '+K}})
        .then(function(r){return r.json();}).then(function(features){
          var map={};(features||[]).forEach(function(f){map[f.feature_key]=true;});
          document.querySelectorAll('[data-feature]').forEach(function(el){
            if(!map[el.dataset.feature]) el.style.display='none';
          });
          return !!map['rfd-check'];
        });
    }).catch(function(){return false;});
}

function loadHubMap(){
  fetch(SB_URL+'/rest/v1/rental_locations?select=id,location_name&order=id',
    {headers:{apikey:ANON_KEY,Authorization:'Bearer '+K}})
    .then(function(r){return r.json();}).then(function(rows){
      (rows||[]).forEach(function(h){hubMap[h.id]=h.location_name;});
    }).catch(function(){});
}

function loadSyncNote(){
  fetch(SB_URL+'/rest/v1/rfd_violations_cache?select=synced_at&order=synced_at.desc&limit=1',
    {headers:{apikey:ANON_KEY,Authorization:'Bearer '+K}})
    .then(function(r){return r.json();}).then(function(rows){
      if(!rows||!rows.length) return;
      var d=new Date(rows[0].synced_at);
      document.getElementById('sync-note').textContent=
        'Data as of '+d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' IST · syncs every 2h';
    }).catch(function(){});
}

// ── Search ────────────────────────────────────────────────────────────────
function doSearch(){
  var raw=document.getElementById('reg-input').value.trim().toUpperCase();
  if(!raw) return;
  var btn=document.getElementById('search-btn');
  btn.disabled=true; btn.textContent='Checking…';
  var area=document.getElementById('result-area');
  area.innerHTML='';

  // Exact match first, then partial
  fetch(SB_URL+'/rest/v1/rfd_violations_cache?select=*&reg_number=ilike.'+encodeURIComponent(raw)+'&order=reg_number&limit=20',
    {headers:{apikey:ANON_KEY,Authorization:'Bearer '+K}})
    .then(function(r){return r.json();})
    .then(function(rows){
      btn.disabled=false; btn.textContent='Check →';
      if(!rows||!rows.length){
        // Try partial
        fetch(SB_URL+'/rest/v1/rfd_violations_cache?select=*&reg_number=ilike.*'+encodeURIComponent(raw)+'*&order=reg_number&limit=20',
          {headers:{apikey:ANON_KEY,Authorization:'Bearer '+K}})
          .then(function(r){return r.json();}).then(function(rows2){
            if(!rows2||!rows2.length) renderNotFound(raw);
            else if(rows2.length===1) renderCard(rows2[0]);
            else renderMulti(rows2);
          }).catch(function(){renderNotFound(raw);});
        return;
      }
      if(rows.length===1) renderCard(rows[0]);
      else renderMulti(rows);
    })
    .catch(function(){
      btn.disabled=false; btn.textContent='Check →';
      renderNotFound(raw);
    });
}

// ── Render helpers ────────────────────────────────────────────────────────
function renderNotFound(reg){
  document.getElementById('result-area').innerHTML=
    '<div class="result-empty"><div class="emoji">🔍</div>'
    +'<p><strong>'+esc(reg)+'</strong> not found in RFD data.</p>'
    +'<p style="margin-top:6px;font-size:.72rem">Vehicle may be compliant (no violations), or data not yet synced. Try Sync Now from the older view if needed.</p>'
    +'</div>';
}

function renderMulti(rows){
  var html='<div class="match-list">'
    +'<div class="match-list-header">'+rows.length+' vehicles found — tap to view</div>';
  rows.forEach(function(r){
    var hubName=hubMap[r.hub_id]||('Hub '+r.hub_id);
    html+='<div class="match-item" onclick="renderCard('+JSON.stringify(r).replace(/"/g,'&quot;')+')">'
      +'<div><div class="match-reg">'+esc(r.reg_number)+'</div>'
      +'<div class="match-hub">'+esc(hubName)+' · '+esc(r.vehicle_status||'')+'</div></div>'
      +'<div style="margin-left:auto;font-size:.7rem;color:var(--muted)">→</div>'
      +'</div>';
  });
  html+='</div>';
  document.getElementById('result-area').innerHTML=html;
}

function renderCard(r){
  var hubName=hubMap[r.hub_id]||('Hub '+(r.hub_id||'?'));
  var iotPending=r.iot_glue_check_needed===true;
  var mcuPending=r.regen_60a_check_needed===true;
  var jcBilled=r.jc_billed===true;
  var allClear=!iotPending&&!mcuPending&&jcBilled;

  var html='<div class="result-card">';

  // Status bar
  html+='<div class="rc-status-bar '+(allClear?'ok':'fail')+'">'
    +'<div style="font-size:1.4rem">'+(allClear?'✅':'🚨')+'</div>'
    +'<div>'
    +'<div class="rc-verdict '+(allClear?'ok':'fail')+'">'+(allClear?'RFD CLEAR':'RFD INCOMPLETE')+'</div>'
    +'<div class="rc-hub">'+esc(hubName)+' · '+esc(r.vehicle_status||'unknown')+' · '+esc(r.iot_provider||'')+'</div>'
    +'</div>'
    +'<div class="rc-reg">'+esc(r.reg_number)+'</div>'
    +'</div>';

  // Checks section
  html+='<div class="rc-section">';
  html+='<div class="rc-section-title">RFD Checks</div>';

  // IoT Glue
  html+='<div class="check-row">'
    +'<div class="check-icon">'+(iotPending?'⚠️':'✅')+'</div>'
    +'<div style="flex:1"><div class="check-label">IoT Glue Check</div>'
    +'<div class="check-detail">iot_glue_check_needed</div></div>'
    +'<div class="check-badge '+(iotPending?'cb-fail':'cb-ok')+'">'+(iotPending?'Pending':'Done')+'</div>'
    +'</div>';

  // MCU FW
  html+='<div class="check-row">'
    +'<div class="check-icon">'+(mcuPending?'⚠️':'✅')+'</div>'
    +'<div style="flex:1"><div class="check-label">MCU FW (60A Regen)</div>'
    +'<div class="check-detail">regen_60a_check_needed</div></div>'
    +'<div class="check-badge '+(mcuPending?'cb-fail':'cb-ok')+'">'+(mcuPending?'Pending':'Done')+'</div>'
    +'</div>';

  // JC Billed
  var jcBadge=r.jc_billed===true?'<span class="check-badge cb-ok">Billed</span>'
    :r.jc_billed===false?'<span class="check-badge cb-amber">'+esc(r.jc_log_status||'Not Billed')+'</span>'
    :'<span class="check-badge cb-muted">No JC</span>';
  var jcDetail=r.jc_ref?esc(r.jc_ref)+(r.total_cost?' · ₹'+Number(r.total_cost).toLocaleString('en-IN',{maximumFractionDigits:0}):'')+(r.technician_name?' · '+esc(r.technician_name):''):'—';
  html+='<div class="check-row">'
    +'<div class="check-icon">'+(jcBilled?'✅':r.jc_billed===false?'⚠️':'➖')+'</div>'
    +'<div style="flex:1"><div class="check-label">JC Billed</div>'
    +'<div class="check-detail">'+jcDetail+'</div></div>'
    +jcBadge
    +'</div>';

  html+='</div>';

  // Context section
  html+='<div class="rc-section">';
  html+='<div class="rc-section-title">Context</div>';
  var ctxRows=[
    ['Rental Status', r.rental_status],
    ['Previous Status', r.previous_vehicle_status],
    ['Ops Last Status', r.ops_last_status],
    ['Activated By', r.activated_by],
    ['Activated At', fmtDate(r.activated_at)],
    ['RFD Validation', r.rfd_validation_status],
    ['JC Status', r.jc_status],
    ['JC Created', fmtDate(r.jc_created_at)],
    ['JC Log Date', fmtDate(r.jc_log_at)],
  ];
  ctxRows.forEach(function(row){
    if(!row[1]) return;
    html+='<div class="ctx-row"><span class="ctx-key">'+esc(row[0])+'</span><span class="ctx-val">'+esc(row[1])+'</span></div>';
  });
  html+='</div>';

  html+='</div>';
  document.getElementById('result-area').innerHTML=html;

  // Scroll to result
  document.getElementById('result-area').scrollIntoView({behavior:'smooth',block:'start'});
}

function fmtDate(ts){
  if(!ts) return null;
  try{
    var d=new Date(ts.replace ? ts.replace(' ','T').replace('+00','Z') : ts);
    if(isNaN(d.getTime())) return ts;
    return d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){return ts;}
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

bootPage();
</script>
</body>
</html>
