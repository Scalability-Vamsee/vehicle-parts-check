html{-webkit-text-size-adjust:100%}

.out{border:none;background:none;color:rgba(255,255,255,.7);font-size:.75rem;cursor:pointer;padding:6px}

.sample{margin:12px 0 0;background:var(--warn-bg);border:1px dashed #F59E0B;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.8rem;font-weight:600}

/* ── FORMAT ── */
const num=(x,d=2)=>Number(x).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:d});
const rupees=x=>{const v=Number(x),f=Number.isInteger(v)?0:2;return '₹'+v.toLocaleString('en-IN',{minimumFractionDigits:f,maximumFractionDigits:f});};   // exact; how pay is rounded is Vamsee's decision
const pct=x=>Number(x).toLocaleString('en-IN',{maximumFractionDigits:1})+'%';
const D=s=>new Date(s+'T00:00:00');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d);};
function dayName(s){return D(s).toLocaleDateString(LOCALE[LANG]||'en-IN',{weekday:'short',day:'numeric',month:'short'});}
function rangeLbl(ws){const a=D(ws),b=D(addDays(ws,6));const o={day:'numeric',month:'short'};const loc=LOCALE[LANG]||'en-IN';return a.toLocaleDateString(loc,o)+' – '+b.toLocaleDateString(loc,o);}

/* ── RULES (same as sql/incentive_v9: lib/jc_points, lib/attendance, 03_weekly_settlement) ──
   In 'live' mode the numbers come from the server tables; these functions only explain them. */
const jcPoints=labourMin=>Math.ceil((0.25+labourMin/60)/0.25-1e-9)*0.25;      // no cap (removed 5 Nov)
const ZIMYO={P:1,OD:1,FP:1,PH:1,WFH:1,HDP:.5,HDA:.5,HDWFH:.5,A:0,WO:0,CL:0,SL:0,ML:0};
function presentOf(code,jcs){if(code&&code in ZIMYO)return ZIMYO[code];return jcs>0?1:0;}  // no Zimyo record: a billed day counts
/* Zero-day week rule (rules page 1c, Vamsee 5 Nov): in a week with billed job cards where Zimyo gives NO present day, a day with 2+ billed job cards
   counts as present (reason 'zero_week'); a week still at 0 days present pays nothing. The server applies it (lib/attendance.cte.sql); the page only shows the reason. */
function rateOf(defPct,c){if(defPct<=c.c40)return 40;if(defPct<=c.c30)return 30;if(defPct<=c.c20)return 20;if(defPct<=c.c10)return 10;return 0;}
/* 18 Nov (Shivani): rules of Vamsee's sent mail of 5 Nov: these city cut-offs, and the rate from the 7-day defect rate of the job cards of THIS WEEK AND THE WEEK BEFORE. */
const MAIL_CUTS={'Bangalore':{c40:3.5,c30:5.5,c20:7,c10:9.5},'NCR':{c40:3,c30:5,c20:7,c10:8.5},'Hyderabad+Mumbai':{c40:1.5,c30:4,c20:5,c10:6.5}};
function mailCfg(cfg,city){const g=city==='Hyderabad'||city==='Mumbai'?'Hyderabad+Mumbai':city;return {...cfg,...(MAIL_CUTS[g]||{})};}
function settle(w,cfg){const target=cfg.target*w.days_present;const above=w.days_present>0?Math.max(0,w.points-target):0;
  const J=w.jcs+(w.prev_jcs||0),Dd=w.defects+(w.prev_defects||0);const def=J?100*Dd/J:0;let rate=w.jcs?rateOf(def,cfg):0;
  return {...w,target,points_above:above,defect_pct:def,def_jcs:J,def_defects:Dd,rate,pay:above*rate};}
/* live bundle: give every week the job cards / defects of the week before (when that week is in the bundle) and the mail's cut-offs */
function attachPrev(b){if(!b||!b.current)return b;const all=[b.current,...(b.past||[])];
  all.forEach(w=>{const p=all.find(x=>x.week_start===addDays(w.week_start,-7));if(p){w.prev_jcs=+p.jcs||0;w.prev_defects=+p.defects||0;}});
  if(b.tech)b.config=mailCfg(b.config,b.tech.city);return b;}

/* ── DATA ──
   Shape = the proposed tables in bounce-workspace sql/incentive_v9/08_proposed_objects.sql:
   settlement rows = incentive_weekly_settlement, days = incentive_day_points, jcs = incentive_jc_points, config = incentive_config.
   Two additions the screens need (for Vamsee's approval): days[].reason (Zimyo code, 'none_jc' or 'zero_week'), jcs[].parts [{name, labour_min}]. */
function incentiveToday(){return new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);}
async function loadWeekBundle(){
  if(REAL_LOCAL){if(!REAL){const which=new URLSearchParams(location.search).get('real');const r=await fetch(which==='oct'?'_local/real_oct.json':which==='nov'?'_local/real_nov.json':'_local/real_all.json',{cache:'no-store'});if(!r.ok)throw new Error('no local real data file');REAL=await r.json();}return realBundle();}
  if(DATA_MODE==='sample')return sampleBundle();
  // Live (once the tables and 09 functions exist): an admin picks any technician, a technician always gets their own rows.
  const isAdmin=!!(window.FP_FEATURES&&window.FP_FEATURES['incentive-admin']);
  if(isAdmin&&!ADMIN_PEOPLE){const r=await sbClient.rpc('incentive_v2_admin_people');if(r.error)throw r.error;ADMIN_PEOPLE=r.data||[];if(!PICK_TECH&&ADMIN_PEOPLE.length)PICK_TECH=ADMIN_PEOPLE[0].name;}
  if(ROLE==='sm'){const r=await sbClient.rpc('incentive_v2_sm_bundle',isAdmin?{p_city:SM_CITY}:{});if(r.error)throw r.error;const d=r.data||{};   // service manager view (17 Nov)
    d.mode='live';if(!d.sm)d.sm={city:isAdmin?SM_CITY:'',sms:0,metrics:[],per_sm:0};d.sm.window=d.sm.window||monthLbl(d.month||incentiveToday());
    d.workshop=d.workshop||{hubs:[],bikes:[]};d.workshop.hubs=d.workshop.hubs||[];d.workshop.bikes=d.workshop.bikes||[];d.board=d.board||{hubs:[],techs:[]};d.board.hubs=d.board.hubs||[];d.board.techs=d.board.techs||[];
    if(!d.top3||!d.top3.cities)d.top3={week_start:d.board.week_start,cities:[]};d.config=d.config||{target:7};return d;}
  const{data,error}=await sbClient.rpc('incentive_v2_my_bundle',isAdmin&&PICK_TECH?{p_technician:PICK_TECH}:{});
  if(error)throw error;return attachPrev(data);
}

/* FAKE sample: invented technician, hub, job card numbers and parts. Not real data. */
function sampleBundle(){
  const cfg={target:7,c40:3.5,c30:5.5,c20:7.0,c10:9.5};           // Bangalore, November (5 Nov mail)
  const asOf='2026-11-26', cur='2026-11-23';                      // a Thursday evening in the 4th paid week
  const P=[['Brake shoe set',35],['Front brake pad',25],['Rear tyre 12 inch',40],['Throttle assembly',30],['Headlight assembly',45],['Side stand spring',10],['Hub motor',95],['Mirror (pair)',10],['Seat lock',20],['Controller',60],['Key fob',0],['Chain / belt adjust',15]];
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const days=[],jcs=[];let n=1;
  const plan=[['2026-11-23','P',6],['2026-11-24','P',7],['2026-11-25','OD',5],['2026-11-26',null,5]];   // ~5-6 points a day, like real September output
  for(const[d,code,k]of plan){
    let dp=0;
    for(let i=0;i<k;i++){
      const parts=[];const np=1+Math.floor(rnd()*3);
      for(let j=0;j<np;j++){const p=P[Math.floor(rnd()*P.length)];if(!parts.find(x=>x.name===p[0]))parts.push({name:p[0],labour_min:p[1]});}
      const lm=parts.reduce((a,p)=>a+p.labour_min,0);const pts=jcPoints(lm);dp+=pts;
      jcs.push({jc_no:'JC-DEMO-'+String(n++).padStart(4,'0'),billed_date:d,labour_min:lm,part_lines:parts.length,points:pts,def_7d:(n===12),parts});
    }

/* Real data (laptop only): the same bundle shape as the sample, built from REAL for the picked technician / city.

const grpOf=c=>c==='Hyderabad'||c==='Mumbai'?'Hyderabad+Mumbai':c;
let REAL_WEEK=null;
const realWeeks=R=>R.weeks||[R.week_start];
function weekOf(t,R,ws){const end=addDays(ws,7);const inW=s=>s>=ws&&s<end;
  const days=t.days.filter(d=>inW(d.d)).map(d=>({d:d.d,reason:d.reason||'nozimyo',jcs:d.jcs,points:d.points,present:d.present??(d.jcs>0?1:0),is_frozen:d.d<R.as_of}));
  const js=t.jcs.filter(j=>inW(j.billed_date));const pts=js.reduce((a,j)=>a+j.points,0),dp=days.reduce((a,d)=>a+d.present,0);
  const pw=addDays(ws,-7);const pjs=t.jcs.filter(j=>j.billed_date>=pw&&j.billed_date<ws);let pj=pjs.length,pdf=pjs.filter(j=>j.def_7d).length;
  if(!pj&&R.prev_week&&R.prev_week.start===pw&&R.prev_week.techs[t.name]){[pj,pdf]=R.prev_week.techs[t.name];}   // 26 Oct to 1 Nov (before the data starts)
  return {days,jcs:js,cur:{week_start:ws,jcs:js.length,defects:js.filter(j=>j.def_7d).length,prev_jcs:pj,prev_defects:pdf,points:pts,days_present:dp,is_final:R.final_until?ws<=R.final_until:!!R.final}};}
function realBundle(){const R=REAL;if(!R._mailCuts){Object.keys(R.config).forEach(g=>Object.assign(R.config[g],MAIL_CUTS[g]||{}));R._mailCuts=true;}const wks=realWeeks(R);if(!REAL_WEEK||!wks.includes(REAL_WEEK))REAL_WEEK=wks[wks.length-1];
  const techs=R.techs.filter(x=>x.jcs.some(j=>j.billed_date>=REAL_WEEK&&j.billed_date<addDays(REAL_WEEK,7)));
  if(!PICK_TECH||!R.techs.find(x=>x.name===PICK_TECH))PICK_TECH=[...techs].sort((a,c)=>c.jcs.length-a.jcs.length)[0].name;
  const t=R.techs.find(x=>x.name===PICK_TECH);   // keep the chosen technician even in a week without job cards
  if(!PICK_CITY)PICK_CITY=t.city;
  const cfg=R.config[grpOf(t.city)];const w=weekOf(t,R,REAL_WEEK);
  const statW=(x,wk)=>{const v=weekOf(x,R,wk).cur;const c=R.config[grpOf(x.city)];const tg=c.target*v.days_present;return {...v,name:x.name,hub:x.hub,city:x.city,ppd:v.days_present?v.points/v.days_present:0,above:v.days_present>0&&v.points>tg,ppd_above:v.days_present?(v.points-tg)/v.days_present:0,defect:v.jcs?100*v.defects/v.jcs:0};};
  const stat=x=>statW(x,REAL_WEEK);
  const all=techs.map(stat);const mates=all.filter(x=>x.hub===t.hub).sort((a,c)=>c.ppd-a.ppd);
  /* 17 Nov: the service manager view has no week picker, so its Leaderboard uses the last complete week and its Top 3 the last final week (not a 1-day current week). */
  const inWk=wk=>R.techs.filter(x=>x.jcs.some(j=>j.billed_date>=wk&&j.billed_date<addDays(wk,7))).map(x=>statW(x,wk));
  const boardWk=ROLE==='sm'?(wks.filter(x=>addDays(x,6)<=R.as_of).pop()||REAL_WEEK):REAL_WEEK;
  const top3Wk=ROLE==='sm'?(R.final_until&&wks.includes(R.final_until)?R.final_until:boardWk):REAL_WEEK;
  const boardAll=boardWk===REAL_WEEK?all:inWk(boardWk),top3All=top3Wk===REAL_WEEK?all:inWk(top3Wk);
  const cityAll=boardAll.filter(x=>x.city===PICK_CITY);
  const hubsAgg={};cityAll.forEach(x=>{const h=hubsAgg[x.hub]||(hubsAgg[x.hub]={hub:x.hub,techs:0,above:0,pts:0,dp:0,j:0,d:0});h.techs++;h.above+=x.above?1:0;h.pts+=x.points;h.dp+=x.days_present;h.j+=x.jcs;h.d+=x.defects;});
  const ws=R.workshop[PICK_CITY]||{hubs:[],bikes:[]};
  const cities=['Bangalore','NCR','Hyderabad','Mumbai'];
  return {...sampleOthers(),mode:'real-local',as_of:R.as_of,month:R.month,notes:R.notes,
    tech:{display_name:t.name,hub:t.hub,city:t.city},config:cfg,current:w.cur,past:wks.filter(x=>x!==REAL_WEEK).map(x=>weekOf(t,R,x).cur).filter(x=>x.jcs>0).reverse(),days:w.days,jcs:w.jcs,
    hub:{rank:mates.findIndex(x=>x.name===t.name)+1,of:mates.length,avg_ppd:mates.reduce((a,x)=>a+x.ppd,0)/(mates.length||1),above:mates.filter(x=>x.above).length},
    top3:{week_start:top3Wk,final:R.final_until?top3Wk<=R.final_until:!!R.final,cities:cities.map(c=>({city:c,rows:top3All.filter(x=>x.city===c&&x.ppd_above>0).sort((a,b)=>b.ppd_above-a.ppd_above).slice(0,3).map(x=>({name:x.name,hub:x.hub,ppd_above:x.ppd_above}))}))},
    workshop:{hubs:ws.hubs,bikes:ws.bikes,as_of:ws.as_of||''},   // 17 Nov: every bike over 5 days (was the oldest 40)
    board:{week_start:boardWk,hubs:Object.values(hubsAgg).map(h=>({hub:h.hub,techs:h.techs,above:h.above,ppd:h.dp?h.pts/h.dp:0,defect:h.j?100*h.d/h.j:0})),
      techs:cityAll.map(x=>({name:x.name,hub:x.hub,ppd:x.ppd,defect:x.defect}))},
    sm:(R.sm&&R.sm[PICK_CITY])?R.sm[PICK_CITY]:{...sampleOthers().sm,city:PICK_CITY},smReal:!!(R.sm&&R.sm[PICK_CITY]),cityCfg:R.config[grpOf(PICK_CITY)],
    roster:R.roster?R.roster.filter(x=>x.city===PICK_CITY).sort((a,z)=>a.role.localeCompare(z.role)||a.hub.localeCompare(z.hub)):null,rosterDays:R.roster_days||'',
    awardsReal:!!R.awards,awardsData:R.awards||null,
    smPerson:(()=>{if(!R.roster)return null;const sms=R.roster.filter(x=>x.role==='Service manager');
      if(!PICK_SM||!sms.find(x=>x.name===PICK_SM&&x.city===PICK_CITY)){const f=sms.find(x=>x.city===PICK_CITY);PICK_SM=f?f.name:PICK_SM;}
      return sms.find(x=>x.name===PICK_SM)||null;})(),
    ...realSk(R)};
}

    const hi=R.findIndex(r=>r.includes('Employee Code')&&r.includes('Designation'));if(hi<0)throw new Error(t('zBad'));const H=R[hi];
    const gen=(R.slice(0,hi).flat().join(' ').match(/(20\d\d)/)||[])[1]||String(new Date().getFullYear());
    const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const today=new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);
    const cols=H.map((h,j)=>{const m=String(h).match(/^(\d{1,2}) ([A-Z][a-z]{2})$/);if(!m||!(m[2] in MON))return null;
      const d=new Date(Date.UTC(+gen,MON[m[2]],+m[1])).toISOString().slice(0,10);return d<today?{j,d}:null;}).filter(Boolean);

  const{data:{session}}=await sbClient.auth.getSession();
  if(session)await activateSession(session);else{goLogin();return;}
  sbClient.auth.onAuthStateChange(async(ev,s)=>{if(ev==='SIGNED_IN'&&s)await activateSession(s);else if(ev==='SIGNED_OUT')goLogin();});
})();
</script>
