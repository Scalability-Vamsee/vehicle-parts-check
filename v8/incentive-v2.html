<style>
#auth-screen{position:fixed;inset:0;z-index:1100;background:linear-gradient(135deg,#1A1A2E 0%,#0f2460 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;padding:16px}
#auth-screen.hidden{display:none!important}
.auth-card{background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.3);text-align:center}
.auth-title{font-size:1.25rem;font-weight:800;color:#0F172A;margin:14px 0 6px}
.auth-sub{font-size:.82rem;color:#6B7280;margin-bottom:22px;line-height:1.6}
.auth-input{width:100%;padding:13px 16px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:.95rem;font-family:inherit;outline:none;margin-bottom:12px}
.auth-input:focus{border-color:#E8191C}
.auth-btn{width:100%;padding:13px;background:#E8191C;color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit}
.auth-btn:disabled{background:#CBD5E1}
.auth-msg{font-size:.8rem;margin-top:12px;min-height:18px;color:#DC2626}
#auth-sent{display:none}

:root{
  --brand:#E8191C;--brand-dark:#B01010;--brand-bg:#FEF2F2;
  --bg:#F5F6FA;--card:#fff;--border:#E5E7EB;--text:#111827;--muted:#6B7280;
  --good:#15803D;--good-bg:#F0FDF4;--warn:#B45309;--warn-bg:#FFFBEB;--bad:#B91C1C;--bad-bg:#FEF2F2;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter','Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.45}
body.lang-hi{font-family:'Noto Sans Devanagari','Inter',sans-serif}
button{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:#1A1A2E;color:#fff;padding:10px 16px calc(10px);display:flex;align-items:center;gap:10px}
.top img{width:28px;height:28px;border-radius:7px}
.top .ttl{font-weight:800;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:2px}
.lang button{border:none;background:none;color:rgba(255,255,255,.75);font-size:.75rem;font-weight:700;padding:5px 9px;border-radius:6px;cursor:pointer;min-height:30px}
.lang button.on{background:#fff;color:#1A1A2E}
.out{border:none;background:none;color:rgba(255,255,255,.7);font-size:.75rem;cursor:pointer;padding:6px}

.sample{margin:12px 0 0;background:var(--warn-bg);border:1px dashed #F59E0B;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.8rem;font-weight:600}
.who{margin:14px 2px 4px}
.who .nm{font-size:1.15rem;font-weight:800}
.who .sub{font-size:.82rem;color:var(--muted)}

/* tabs + weeks */
.tabs{display:flex;gap:6px;margin:12px 0 10px;background:#E9EBF2;padding:4px;border-radius:12px}
.tabs button{flex:1;border:none;background:none;padding:10px 6px;border-radius:9px;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer;min-height:42px}
.tabs button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.weeks{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text);min-height:36px}
.wk.on{border-color:var(--brand);color:var(--brand);background:var(--brand-bg)}

.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:12px}
.card h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:.68rem;font-weight:700;text-transform:none;letter-spacing:0;padding:3px 8px;border-radius:999px}
.tag.prov{background:var(--warn-bg);color:var(--warn)}
.tag.final{background:var(--good-bg);color:var(--good)}

/* hero */
.hero .big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.hero .big b{font-size:2.6rem;font-weight:800;line-height:1}
.hero .big span{color:var(--muted);font-size:.95rem;font-weight:600}
.bar{height:12px;background:#EEF0F5;border-radius:999px;margin:14px 0 6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--brand)}
.bar i.ok{background:var(--good)}
.barlbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.88rem;font-weight:600}
.msg.go{background:var(--brand-bg);color:var(--brand-dark)}
.msg.ok{background:var(--good-bg);color:var(--good)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#F8F9FC;border-radius:12px;padding:12px}
.stat .k{font-size:.72rem;color:var(--muted);font-weight:600}
.stat .v{font-size:1.35rem;font-weight:800;margin-top:2px}
.stat .n{font-size:.72rem;color:var(--muted);margin-top:2px}
.stat.hl{background:var(--good-bg)} .stat.hl .v{color:var(--good)}

.list{list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.list li:first-child{border-top:none}
.list .l{min-width:0}
.list .l b{display:block;font-size:.88rem}
.list .l small{display:block;color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .r{text-align:right;font-weight:800;white-space:nowrap}
.list .r small{display:block;font-weight:600;color:var(--muted);font-size:.72rem}
.empty{color:var(--muted);font-size:.85rem}
.link{border:none;background:none;color:var(--brand);font-weight:700;font-size:.85rem;cursor:pointer;padding:8px 0 0;min-height:36px}

/* how calculated */
.step{display:flex;gap:10px}
.step .no{flex:0 0 26px;height:26px;border-radius:50%;background:#1A1A2E;color:#fff;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .tx{flex:1;min-width:0}
.step .tx p{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.sum{display:flex;justify-content:space-between;font-weight:800;padding-top:10px;margin-top:6px;border-top:2px solid var(--text)}
.day{border-top:1px solid var(--border);padding:10px 0}
.day:first-of-type{border-top:none}
.day .dh{display:flex;justify-content:space-between;font-weight:700;font-size:.88rem;cursor:pointer;list-style:none;min-height:32px;align-items:center}
.day .dh::-webkit-details-marker{display:none}
.day .dh span:first-child::before{content:'▸ ';color:var(--muted)}
.day[open] .dh span:first-child::before{content:'▾ '}
.jc{background:#F8F9FC;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.8rem}
.jc .jh{display:flex;justify-content:space-between;font-weight:700}
.jc .pt{color:var(--muted);margin-top:2px}
.jc .fx{margin-top:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px}
.pill.y{background:var(--good-bg);color:var(--good)} .pill.n{background:#F1F5F9;color:var(--muted)} .pill.h{background:var(--warn-bg);color:var(--warn)} .pill.d{background:var(--bad-bg);color:var(--bad)}
table.sl{width:100%;border-collapse:collapse;font-size:.85rem}
table.sl td{padding:8px 6px;border-top:1px solid var(--border)}
table.sl tr.me td{background:var(--good-bg);font-weight:800}
table.sl td:last-child{text-align:right}
.note{font-size:.75rem;color:var(--muted);margin-top:8px}
.foot{font-size:.72rem;color:var(--muted);text-align:center;margin-top:18px}
/* role switch (sample mode / admin), multi-tab bar */
.viewas{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.8rem;font-weight:700;color:var(--muted);flex-wrap:wrap}
.viewas select{flex:1 1 140px;min-width:0;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:.85rem;background:#fff;min-height:40px}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding:10px 12px}
/* scorecard */
.met{border-top:1px solid var(--border);padding:12px 0}
.met:first-of-type{border-top:none;padding-top:0}
.met .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.met .mh b{font-size:.92rem}
.met .mv{font-size:1.25rem;font-weight:800;margin-top:2px}
.bars{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.bars span{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:#F1F5F9;color:var(--muted)}
.bars span.hit{background:var(--good-bg);color:var(--good)}
.earn{font-weight:800;white-space:nowrap}
.earn.z{color:var(--muted)} .earn.p{color:var(--good)}
.big2{font-size:2rem;font-weight:800;line-height:1.1}
.wkrow{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--border);font-size:.82rem}
.wkrow.h{border-top:none;font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;padding-top:0}
.ok{color:var(--good);font-weight:800} .no{color:var(--bad);font-weight:800} .pend{color:var(--muted);font-weight:700}
.rank{flex:0 0 26px;height:26px;border-radius:50%;background:#F1F5F9;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;margin-right:10px}
.rank.r1{background:#FEF3C7;color:#92400E}
.rowl{display:flex;align-items:center;min-width:0}
</style>
</head>

/* ── FORMAT ── */
const num=(x,d=2)=>Number(x).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:d});
const rupees=x=>{const v=Number(x),f=Number.isInteger(v)?0:2;return '₹'+v.toLocaleString('en-IN',{minimumFractionDigits:f,maximumFractionDigits:f});};   // exact; how pay is rounded is Vamsee's decision
const pct=x=>Number(x).toLocaleString('en-IN',{maximumFractionDigits:1})+'%';
const D=s=>new Date(s+'T00:00:00');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d);};
function dayName(s){return D(s).toLocaleDateString(LANG==='hi'?'hi-IN':'en-IN',{weekday:'short',day:'numeric',month:'short'});}
function rangeLbl(ws){const a=D(ws),b=D(addDays(ws,6));const o={day:'numeric',month:'short'};const loc=LANG==='hi'?'hi-IN':'en-IN';return a.toLocaleDateString(loc,o)+' – '+b.toLocaleDateString(loc,o);}

/* ── RULES (same as sql/incentive_v9: lib/jc_points, lib/attendance, 03_weekly_settlement) ──
   In 'live' mode the numbers come from the server tables; these functions only explain them. */
const jcPoints=labourMin=>Math.ceil((0.25+labourMin/60)/0.25-1e-9)*0.25;      // no cap (removed 5 Nov)
const ZIMYO={P:1,OD:1,FP:1,PH:1,WFH:1,HDP:.5,HDA:.5,HDWFH:.5,A:0,WO:0,CL:0,SL:0,ML:0};
function presentOf(code,jcs){if(code&&code in ZIMYO)return ZIMYO[code];return jcs>0?1:0;}  // no Zimyo record: a billed day counts
/* Zero-day week rule (rules page 1c, Vamsee 5 Nov): in a week with billed job cards where Zimyo gives NO present day, a day with 2+ billed job cards
   counts as present (reason 'zero_week'); a week still at 0 days present pays nothing. The server applies it (lib/attendance.cte.sql); the page only shows the reason. */
function rateOf(defPct,c){if(defPct<=c.c40)return 40;if(defPct<=c.c30)return 30;if(defPct<=c.c20)return 20;if(defPct<=c.c10)return 10;return 0;}
function settle(w,cfg){const target=cfg.target*w.days_present;const above=w.days_present>0?Math.max(0,w.points-target):0;
  const def=w.jcs?100*w.defects/w.jcs:0;const rate=w.jcs?rateOf(def,cfg):0;return {...w,target,points_above:above,defect_pct:def,rate,pay:above*rate};}

/* ── DATA ──
   Shape = the proposed tables in bounce-workspace sql/incentive_v9/08_proposed_objects.sql:
   settlement rows = incentive_weekly_settlement, days = incentive_day_points, jcs = incentive_jc_points, config = incentive_config.
   Two additions the screens need (for Vamsee's approval): days[].reason (Zimyo code, 'none_jc' or 'zero_week'), jcs[].parts [{name, labour_min}]. */

}

function sampleBundle(){
  const cfg={target:7,c40:3.0,c30:5.0,c20:7.0,c10:9.5};           // Bangalore, November (sample of the decided rules)
  const asOf='2026-11-26', cur='2026-11-23';                      // a Thursday evening in the 4th paid week
  const P=[['Brake shoe set',35],['Front brake pad',25],['Rear tyre 12 inch',40],['Throttle assembly',30],['Headlight assembly',45],['Side stand spring',10],['Hub motor',95],['Mirror (pair)',10],['Seat lock',20],['Controller',60],['Key fob',0],['Chain / belt adjust',15]];
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const days=[],jcs=[];let n=1;
  const plan=[['2026-11-23','P',6],['2026-11-24','P',7],['2026-11-25','OD',5],['2026-11-26',null,5]];   // ~5-6 points a day, like real September output
  for(const[d,code,k]of plan){
    let dp=0;
    for(let i=0;i<k;i++){
      const parts=[];const np=1+Math.floor(rnd()*3);
      for(let j=0;j<np;j++){const p=P[Math.floor(rnd()*P.length)];if(!parts.find(x=>x.name===p[0]))parts.push({name:p[0],labour_min:p[1]});}
      const lm=parts.reduce((a,p)=>a+p.labour_min,0);const pts=jcPoints(lm);dp+=pts;
      jcs.push({jc_no:'JC-DEMO-'+String(n++).padStart(4,'0'),billed_date:d,labour_min:lm,part_lines:parts.length,points:pts,def_7d:(n===12),parts});
    }
    days.push({d,code,reason:code||'none_jc',jcs:k,points:dp,present:presentOf(code,k),is_frozen:d<asOf});
  }
  const curW={week_start:cur,jcs:jcs.length,defects:jcs.filter(j=>j.def_7d).length,points:days.reduce((a,x)=>a+x.points,0),days_present:days.reduce((a,x)=>a+x.present,0),is_final:false};
  const past=[

    {week_start:'2026-11-09',jcs:31,defects:1,points:36,days_present:5.5,is_final:true},   // below target: pays 0
    {week_start:'2026-11-02',jcs:41,defects:2,points:44.25,days_present:6,is_final:true}];
  return {mode:'sample',as_of:asOf,tech:{display_name:'Sample Technician',hub:'Sample Hub',city:'Bangalore'},config:cfg,
    current:curW,past,days,jcs,hub:{rank:3,of:11,avg_ppd:5.6,above:4},...sampleOthers()};
}

/* Real data (laptop only): the same bundle shape as the sample, built from REAL for the picked technician / city.
   Service manager scorecard, store keeper checklist and awards are not in the real file yet: they stay sample and say so. */
const grpOf=c=>c==='Hyderabad'||c==='Mumbai'?'Hyderabad+Mumbai':c;
let REAL_WEEK=null;
const realWeeks=R=>R.weeks||[R.week_start];
function weekOf(t,R,ws){const end=addDays(ws,7);const inW=s=>s>=ws&&s<end;
  const days=t.days.filter(d=>inW(d.d)).map(d=>({d:d.d,reason:d.reason||'nozimyo',jcs:d.jcs,points:d.points,present:d.present??(d.jcs>0?1:0),is_frozen:d.d<R.as_of}));
  const js=t.jcs.filter(j=>inW(j.billed_date));const pts=js.reduce((a,j)=>a+j.points,0),dp=days.reduce((a,d)=>a+d.present,0);
  return {days,jcs:js,cur:{week_start:ws,jcs:js.length,defects:js.filter(j=>j.def_7d).length,points:pts,days_present:dp,is_final:!!R.final}};}
function realBundle(){const R=REAL;const wks=realWeeks(R);if(!REAL_WEEK||!wks.includes(REAL_WEEK))REAL_WEEK=wks[wks.length-1];
  const techs=R.techs.filter(x=>x.jcs.some(j=>j.billed_date>=REAL_WEEK&&j.billed_date<addDays(REAL_WEEK,7)));
  if(!PICK_TECH||!R.techs.find(x=>x.name===PICK_TECH))PICK_TECH=[...techs].sort((a,c)=>c.jcs.length-a.jcs.length)[0].name;
  const t=R.techs.find(x=>x.name===PICK_TECH);   // keep the chosen technician even in a week without job cardsif(!PICK_CITY)PICK_CITY=t.city;
  const cfg=R.config[grpOf(t.city)];const w=weekOf(t,R,REAL_WEEK);
  const stat=x=>{const v=weekOf(x,R,REAL_WEEK).cur;const c=R.config[grpOf(x.city)];const tg=c.target*v.days_present;return {...v,name:x.name,hub:x.hub,city:x.city,ppd:v.days_present?v.points/v.days_present:0,above:v.days_present>0&&v.points>tg,ppd_above:v.days_present?(v.points-tg)/v.days_present:0,defect:v.jcs?100*v.defects/v.jcs:0};};
  const all=techs.map(stat);const mates=all.filter(x=>x.hub===t.hub).sort((a,c)=>c.ppd-a.ppd);
  const cityAll=all.filter(x=>x.city===PICK_CITY);
  const hubsAgg={};cityAll.forEach(x=>{const h=hubsAgg[x.hub]||(hubsAgg[x.hub]={hub:x.hub,techs:0,above:0,pts:0,dp:0,j:0,d:0});h.techs++;h.above+=x.above?1:0;h.pts+=x.points;h.dp+=x.days_present;h.j+=x.jcs;h.d+=x.defects;});
  const ws=R.workshop[PICK_CITY]||{hubs:[],bikes:[]};
  const cities=['Bangalore','NCR','Hyderabad','Mumbai'];
  return {...sampleOthers(),mode:'real-local',as_of:R.as_of,month:R.month,notes:R.notes,
    tech:{display_name:t.name,hub:t.hub,city:t.city},config:cfg,current:w.cur,past:wks.filter(x=>x!==REAL_WEEK).map(x=>weekOf(t,R,x).cur).filter(x=>x.jcs>0).reverse(),days:w.days,jcs:w.jcs,
    hub:{rank:mates.findIndex(x=>x.name===t.name)+1,of:mates.length,avg_ppd:mates.reduce((a,x)=>a+x.ppd,0)/(mates.length||1),above:mates.filter(x=>x.above).length},
    top3:{week_start:REAL_WEEK,final:!!R.final,cities:cities.map(c=>({city:c,rows:all.filter(x=>x.city===c&&x.ppd_above>0).sort((a,b)=>b.ppd_above-a.ppd_above).slice(0,3).map(x=>({name:x.name,hub:x.hub,ppd_above:x.ppd_above}))}))},
    workshop:{hubs:ws.hubs,bikes:ws.bikes.slice(0,40)},
    board:{hubs:Object.values(hubsAgg).map(h=>({hub:h.hub,techs:h.techs,above:h.above,ppd:h.dp?h.pts/h.dp:0,defect:h.j?100*h.d/h.j:0})),
      techs:cityAll.map(x=>({name:x.name,hub:x.hub,ppd:x.ppd,defect:x.defect}))},
    sm:(R.sm&&R.sm[PICK_CITY])?R.sm[PICK_CITY]:{...sampleOthers().sm,city:PICK_CITY},smReal:!!(R.sm&&R.sm[PICK_CITY]),cityCfg:R.config[grpOf(PICK_CITY)],
    roster:R.roster?R.roster.filter(x=>x.city===PICK_CITY).sort((a,z)=>a.role.localeCompare(z.role)||a.hub.localeCompare(z.hub)):null,rosterDays:R.roster_days||''};
}
function pickTech(v){PICK_TECH=v;const t=REAL.techs.find(x=>x.name===v);if(t)PICK_CITY=t.city;BUNDLE=realBundle();render();}
function pickCity(v){PICK_CITY=v;BUNDLE=realBundle();render();}

/* ── RULES for the other roles (same as sql/incentive_v9/04_sm_scorecard.sql and lib/store_keeper_score.cte.sql) ── */
function smPay(m){const ok=(v,bar)=>m.dir==='low'?v<=bar:v>=bar;if(m.value==null)return 0;
  if(ok(m.value,m.s1000)&&(m.key!=='B2'||m.p98<=m.p98bar))return 1000;return ok(m.value,m.s500)?500:0;}       // B2 ₹1,000 also needs P98 at or under its bar
function skWeek(w){const msl=w.msl_total>0&&w.msl_ok/w.msl_total>=0.9;const scrap=!!w.no_scrap||(!!w.note&&!!w.cleared&&w.cleared<=addDays(w.ws,1));
  return {...w,msl_share:w.msl_total>0?w.msl_ok/w.msl_total:null,msl_met:msl,scrap_met:scrap};}
const skSlab=(met,n)=>n>0&&met>=n?1000:n>0&&met===n-1?500:0;                                                   // every week ₹1,000, all but one ₹500
function skCycle(c,asOf){const met=!!c.no_parts||(!!c.note&&!!c.date&&c.date<=c.due);return {...c,met,pending:!met&&asOf<=c.due};}

/* Tabs per role. Who is which role comes from FleetPro permissions: incentive-tech (exists), incentive-admin (exists, can switch role),
   incentive-sm and incentive-sk (NEW keys, need Vamsee's approval). A technician never gets the city or other technicians' detail. */
const TABS_BY_ROLE={tech:['home','calc','top3'],sm:['city','workshop','board','top3','awards'],sk:['checklist','awards']};
let ROLE='tech', CAN_SWITCH=false;
function setRole(r){ROLE=r;TAB=TABS_BY_ROLE[r][0];render();window.scrollTo({top:0});}
const monthLbl=s=>D(s).toLocaleDateString(LANG==='hi'?'hi-IN':'en-IN',{month:'long',year:'numeric'});
function render(){
  const b=BUNDLE;const sb=document.getElementById('sample-banner');sb.style.display=b.mode==='sample'||b.mode==='real-local'?'block':'none';
  sb.textContent=b.mode==='real-local'?(REAL&&REAL.label==='October test'?t('realBannerOct'):REAL&&REAL.label==='November'?t('realBannerNov'):t('realBanner')):t('sample');
  const va=document.getElementById('viewas');va.style.display=CAN_SWITCH?'flex':'none';
  const ps=document.getElementById('pick-sel');
  if(b.mode==='real-local'&&(ROLE==='tech'||ROLE==='sm')){ps.style.display='block';
    if(ROLE==='tech'){ps.onchange=e=>pickTech(e.target.value);
      ps.innerHTML=['Bangalore','NCR','Hyderabad','Mumbai'].map(c=>`<optgroup label="${esc(c)}">${REAL.techs.filter(x=>x.city===c).sort((a,z)=>a.name.localeCompare(z.name)).map(x=>`<option value="${esc(x.name)}" ${x.name===PICK_TECH?'selected':''}>${esc(x.name)} · ${esc(x.hub)}</option>`).join('')}</optgroup>`).join('');}
    else{ps.onchange=e=>pickCity(e.target.value);ps.innerHTML=['Bangalore','NCR','Hyderabad','Mumbai'].map(c=>`<option ${c===PICK_CITY?'selected':''}>${esc(c)}</option>`).join('');}
  }else ps.style.display='none';
  if(CAN_SWITCH)document.getElementById('role-sel').innerHTML=['tech','sm','sk'].map(r=>`<option value="${r}" ${r===ROLE?'selected':''}>${esc(t('role_'+r))}</option>`).join('');
  const nm=document.getElementById('who-name'),sub=document.getElementById('who-sub');
  if(ROLE==='tech'){nm.textContent=b.tech.display_name;sub.textContent=b.tech.hub+' · '+b.tech.city+' · '+t('target')+' '+num(b.config.target)+' '+t('pts')+' '+t('perDay');}
  else if(ROLE==='sm'){nm.textContent=t('role_sm');sub.textContent=b.sm.city+' · '+monthLbl(b.month);}
  else{nm.textContent=t('role_sk');sub.textContent=b.sk.hub+' · '+monthLbl(b.month);}
  const tabs=TABS_BY_ROLE[ROLE];if(!tabs.includes(TAB))TAB=tabs[0];
  document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="${x===TAB?'on':''}" onclick="showTab('${x}')">${esc(t('tab_'+x))}</button>`).join('');
  const weekTab=TAB==='home'||TAB==='calc';const all=b.mode==='real-local'?[b.current,...b.past].sort((x,y)=>x.week_start<y.week_start?-1:1):[b.current,...b.past];if(!WEEK||b.mode==='real-local')WEEK=b.current.week_start;
  const wk=document.getElementById('weeks');wk.style.display=weekTab?'flex':'none';
  wk.innerHTML=weekTab?all.map(w=>`<button class="wk ${w.week_start===WEEK?'on':''}" onclick="pickWeek('${w.week_start}')">${w.week_start===b.current.week_start&&b.mode!=='real-local'?esc(t('thisWeek')):esc(rangeLbl(w.week_start))}</button>`).join(''):'';
  const w=settle(all.find(x=>x.week_start===WEEK),b.config);const isCur=WEEK===b.current.week_start;
  const V={home:()=>homeHtml(b,w,isCur),calc:()=>calcHtml(b,w,isCur),top3:()=>top3Html(b),city:()=>cityHtml(b),workshop:()=>workshopHtml(b),board:()=>boardHtml(b),awards:()=>awardsHtml(b),checklist:()=>checklistHtml(b)};
  const stillSample=b.mode==='real-local'&&(['checklist','awards'].includes(TAB)||(TAB==='city'&&!b.smReal))?`<div class="sample">${esc(t('stillSample'))}</div>`:'';
  document.getElementById('view').innerHTML=stillSample+V[TAB]();
  document.getElementById('foot').textContent=t('asOf',{d:dayName(b.as_of)})+' · '+t('updated');
}

  return `<div class="card"><h3>${esc(t('totmT'))} · ${esc(tm.hub)} <span class="tag prov">₹1,500</span></h3>
    <p class="note" style="margin:0 0 6px">${esc(t('totmP'))}</p>
    <ul class="list">${el.map((r,i)=>`<li><div class="rowl"><span class="rank ${i===0?'r1':''}">${i+1}</span><div class="l"><b>${esc(r.name)}</b><small>${num(r.ppd,1)} ${esc(t('ppd'))} (${esc(t('target'))} ${num(r.target)})</small></div></div><div class="r">${pct(r.defect)}<small>${esc(t('defect'))}</small></div></li>`).join('')}</ul>
    <div class="msg ${el.length>=tm.needed?'ok':'go'}">${esc(el.length>=tm.needed?t('totmOk',{e:el.length}):t('totmPool',{e:el.length,n:tm.needed}))}</div></div>
   <div class="card"><h3>${esc(t('supT'))} <span class="tag prov">+₹2,000</span></h3><p class="note" style="margin:0">${esc(t('supP'))}</p></div>
   <div class="card"><h3>${esc(t('smotmT'))} <span class="tag prov">₹5,000</span></h3><ul class="list">${a.smotm.map((r,i)=>`<li><div class="rowl"><span class="rank ${i===0?'r1':''}">${i+1}</span><div class="l"><b>${esc(r.hub)}</b></div></div><div class="r">${rupees(r.score)}<small>${esc(t('hubScore'))}</small></div></li>`).join('')}</ul></div>
   <div class="card"><h3>${esc(t('skotmT'))} <span class="tag prov">₹2,500</span></h3><ul class="list">${a.skotm.map((r,i)=>`<li><div class="rowl"><span class="rank ${i===0?'r1':''}">${i+1}</span><div class="l"><b>${esc(r.hub)}</b><small>MSL ${pct(100*r.msl)}</small></div></div><div class="r">${rupees(r.total)}<small>/ ₹3,000</small></div></li>`).join('')}</ul></div>`;}
function homeHtml(b,w,isCur){
  const prog=w.target>0?Math.min(100,100*w.points/w.target):0;const reached=w.points>=w.target&&w.target>0;
  const tag=w.is_final?`<span class="tag final">${esc(t('final'))}</span>`:`<span class="tag prov">${esc(t('prov'))}</span>`;
  let h=`<div class="card hero"><h3>${esc(isCur&&b.mode!=='real-local'?t('thisWeek'):t('week'))} · ${esc(rangeLbl(w.week_start))} ${tag}</h3>
   <div class="big"><b>${num(w.points)}</b><span>${esc(t('pointsSoFar'))} / ${num(w.target)} ${esc(t('target'))}</span></div>
   <div class="bar"><i class="${reached?'ok':''}" style="width:${prog}%"></i></div>
   <div class="barlbl"><span>0</span><span>${esc(t('target'))} ${num(w.target)} = ${num(b.config.target)} × ${num(w.days_present,1)} ${esc(t('daysPresent'))}</span></div>
   <div class="msg ${reached?'ok':'go'}">${esc(reached?t('reached'):t('toGo',{n:num(w.target-w.points)}))}</div></div>`;
  h+=`<div class="card"><div class="grid">
   <div class="stat"><div class="k">${esc(t('above'))}</div><div class="v">${num(w.points_above)}</div></div>
   <div class="stat"><div class="k">${esc(t('defect'))}</div><div class="v">${pct(w.defect_pct)}</div><div class="n">${esc(t('defectN',{d:w.defects,j:w.jcs}))}</div></div>
   <div class="stat"><div class="k">${esc(t('rate'))}</div><div class="v">${rupees(w.rate)}</div><div class="n">${esc(w.is_final?t('final'):t('untilFinal'))}</div></div>
   <div class="stat hl"><div class="k">${esc(isCur?t('earned'):t('earnedW'))}</div><div class="v">${rupees(w.pay)}</div><div class="n">${num(w.points_above)} × ${rupees(w.rate)}</div></div>
   </div><button class="link" onclick="showTab('calc')">${esc(t('seeHow'))}</button></div>`;
  if(isCur){const last=b.jcs.slice(-5).reverse();
    h+=`<div class="card"><h3>${esc(t('lastJcs'))}</h3><ul class="list">${last.map(j=>`<li><div class="l"><b>${esc(j.jc_no)}</b><small>${esc(dayName(j.billed_date))} · ${esc(j.parts.map(p=>p.name).join(', ')||'—')}</small></div><div class="r">${num(j.points)}<small>${esc(t('pts'))}</small></div></li>`).join('')}</ul></div>`;
    h+=`<div class="card"><h3>${esc(t('hub'))}</h3><ul class="list"><li><div class="l"><b>${esc(t('rankOf',{r:b.hub.rank,n:b.hub.of}))}</b><small>${esc(t('hubAvg',{a:num(b.hub.avg_ppd,1)}))}</small></div></li><li><div class="l"><b>${esc(t('hubAbove',{a:b.hub.above,n:b.hub.of}))}</b></div></li></ul></div>`;}
  const rows=[b.current,...b.past].map(x=>settle(x,b.config));
  h+=`<div class="card"><h3>${esc(t('pastWeeks'))}</h3><ul class="list">${rows.map(x=>`<li onclick="pickWeek('${x.week_start}')" style="cursor:pointer"><div class="l"><b>${esc(rangeLbl(x.week_start))}</b><small>${num(x.points)} / ${num(x.target)} ${esc(t('pts'))} · ${rupees(x.rate)}/${esc(t('pts'))} · ${esc(x.is_final?t('final'):t('prov'))}</small></div><div class="r">${rupees(x.pay)}<small>${esc(t('pay'))}</small></div></li>`).join('')}</ul></div>`;
  return h;
}
function calcHtml(b,w,isCur){
  if(!isCur)return `<div class="card">${stepHtml(3,t('s3'),t('s3p'),`<div class="sum"><span>${num(b.config.target)} × ${num(w.days_present,1)}</span><span>${num(w.target)}</span></div>`)}${rateStep(b,w)}${payStep(w)}</div><p class="note">${esc(t('notFinal'))}</p>`;
  const lastD=b.days.length?b.days[b.days.length-1].d:null;
  const byDay=b.days.map(d=>{const list=b.jcs.filter(j=>j.billed_date===d.d);
    return `<details class="day" ${d.d===lastD?'open':''}><summary class="dh"><span>${esc(dayName(d.d))} · ${list.length} JC</span><span>${num(d.points)} ${esc(t('pts'))}</span></summary>${list.length?list.map(j=>{const raw=0.25+j.labour_min/60;
      return `<div class="jc"><div class="jh"><span>${esc(j.jc_no)}${j.def_7d?`<span class="pill d">7d</span>`:''}</span><span>${num(j.points)}</span></div><div class="pt">${esc(j.parts.map(p=>p.name+' '+p.labour_min+' min').join(' · ')||'—')}</div><div class="fx">${esc(t('formula',{m:j.labour_min,raw:num(raw),pts:num(j.points)}))}</div></div>`;}).join(''):`<div class="empty">${esc(t('noJcs'))}</div>`}</details>`;}).join('');
  const daysHtml=b.days.map(d=>{const cls=d.present>=1?'y':d.present>0?'h':'n';const lbl=d.present>=1?t('dayPresent'):d.present>0?t('dayHalf'):t('dayAbs');
    return `<li><div class="l"><b>${esc(dayName(d.d))}<span class="pill ${cls}">${esc(lbl)}</span></b><small>${esc(why(d.reason))}</small></div><div class="r">${num(d.present,1)}</div></li>`;}).join('');
  return `<div class="card">
   ${stepHtml(1,t('s1'),t('s1p'),byDay+`<div class="sum"><span>${esc(t('total'))}</span><span>${num(w.points)} ${esc(t('pts'))}</span></div>`)}</div>
   <div class="card">${stepHtml(2,t('s2'),t('s2p'),`<ul class="list">${daysHtml}</ul><div class="sum"><span>${esc(t('total'))}</span><span>${num(w.days_present,1)}</span></div>`)}</div>
   <div class="card">${stepHtml(3,t('s3'),t('s3p'),`<div class="sum"><span>${num(b.config.target)} × ${num(w.days_present,1)}</span><span>${num(w.target)} ${esc(t('pts'))}</span></div>`)}</div>
   <div class="card">${rateStep(b,w)}</div><div class="card">${payStep(w)}</div><p class="note">${esc(t('notFinal'))}</p>`;
}
function stepHtml(no,title,p,body){return `<div class="step"><div class="no">${no}</div><div class="tx"><h3 style="margin-bottom:4px">${esc(title)}</h3><p>${esc(p)}</p>${body}</div></div>`;}
function rateStep(b,w){const c=b.config;const rows=[[40,t('upTo',{c:c.c40})],[30,t('upTo',{c:c.c30})],[20,t('upTo',{c:c.c20})],[10,t('upTo',{c:c.c10})],[0,t('over',{c:c.c10})]];
  return stepHtml(4,t('s4'),t('s4p'),`<div style="font-weight:700;margin-bottom:6px">${pct(w.defect_pct)} = ${w.defects} ÷ ${w.jcs}</div><table class="sl">${rows.map(([r,l])=>`<tr class="${r===w.rate?'me':''}"><td>${esc(t('defect'))} ${esc(l)}${r===w.rate?' ← '+esc(t('yours')):''}</td><td>${rupees(r)}</td></tr>`).join('')}</table>`);}
function payStep(w){return stepHtml(5,t('s5'),t('s5p'),`<div class="sum"><span>${num(w.points)} − ${num(w.target)} = ${num(w.points_above)} × ${rupees(w.rate)}</span><span>${rupees(w.pay)}</span></div>`);}
function pickWeek(ws){WEEK=ws;if(REAL_LOCAL&&REAL){REAL_WEEK=ws;BUNDLE=realBundle();}render();window.scrollTo({top:0,behavior:'smooth'});}
function showTab(x){TAB=x;render();window.scrollTo({top:0});}

/* ── AUTH (FleetPro pattern: auth screen covers the page; permissions FIRST, then hide it) ── */
function showAuthScreen(){document.getElementById('auth-screen').classList.remove('hidden');showForm();}
function hideAuthScreen(){document.getElementById('auth-screen').classList.add('hidden');}
function showForm(){document.getElementById('auth-form').style.display='block';document.getElementById('auth-sent').style.display='none';document.getElementById('auth-msg').textContent='';}
async function sendMagicLink(){
  const email=document.getElementById('auth-email').value.trim().toLowerCase();const msg=document.getElementById('auth-msg');const btn=document.getElementById('auth-btn');
  if(!email){msg.textContent='Please enter your email.';return;}
  btn.disabled=true;
  if(!email.endsWith('@bounceshare.com')){const{data:ok}=await sbClient.rpc('is_approved_user',{p_email:email});if(!ok){msg.textContent='Your email is not registered. Contact your hub manager.';btn.disabled=false;return;}}
  const res=await sbClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});btn.disabled=false;
  if(res.error){msg.textContent=res.error.message;}else{document.getElementById('auth-form').style.display='none';document.getElementById('auth-sent').style.display='block';}
}
document.getElementById('auth-email').addEventListener('keydown',e=>{if(e.key==='Enter')sendMagicLink();});
async function signOut(){await sbClient.auth.signOut();document.getElementById('logout-btn').style.display='none';showAuthScreen();}
async function loadUserPermissions(session){
  if(session?.user?.app_metadata?.is_superadmin)return {'incentive-admin':true,'incentive-tech':true};
  try{const r1=await sbClient.from('user_groups').select('group_id').eq('user_id',session.user.id);if(!r1.data||!r1.data.length)return {};
    const r2=await sbClient.from('group_features').select('feature_key').in('group_id',r1.data.map(r=>r.group_id));
    const f={};(r2.data||[]).forEach(r=>{f[r.feature_key]=true;});return f;}catch(e){console.warn('[FP] permission check failed',e);return {};}
}
let _booted=false;
async function activateSession(session){
  if(_booted)return;
  const f=await loadUserPermissions(session);window.FP_FEATURES=f;
  if(!f['incentive-tech']&&!f['incentive-admin']&&!f['incentive-sm']&&!f['incentive-sk']){location.href='index.html';return;}
  ROLE=f['incentive-sm']?'sm':f['incentive-sk']?'sk':'tech';CAN_SWITCH=!!f['incentive-admin']||DATA_MODE==='sample';
  _booted=true;hideAuthScreen();document.getElementById('logout-btn').style.display='block';await start();
}
async function start(){try{BUNDLE=await loadWeekBundle();if(LOCAL_PREVIEW)CAN_SWITCH=true;TAB=TABS_BY_ROLE[ROLE][0];render();}catch(e){document.getElementById('view').innerHTML='<div class="card empty">Could not load your data. Please try again later.</div>';console.error(e);}}

(async function boot(){
  let saved='en';try{saved=localStorage.getItem('fp_lang')||'en';}catch(e){}setLang(saved==='hi'?'hi':'en');
  if(LOCAL_PREVIEW){hideAuthScreen();await start();return;}
  const{data:{session}}=await sbClient.auth.getSession();
  if(session)await activateSession(session);else showAuthScreen();
  sbClient.auth.onAuthStateChange(async(ev,s)=>{if(ev==='SIGNED_IN'&&s)await activateSession(s);else if(ev==='SIGNED_OUT'){_booted=false;showAuthScreen();}});
})();
</script>
